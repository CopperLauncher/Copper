// Root Gradle build file.
//
// AGP is declared here ONCE, for both plugin ids used anywhere in this project, each with
// "apply false" (resolved, but not applied to the root project itself). Every module then
// requests it *without* its own version - app_pojavlauncher below, and the SimpleFPEWrapper
// submodule (git submodule, MobileGL-Dev/SimpleFPEWrapper), which applies AGP the classic
// way ("apply plugin: 'com.android.library'", no version at all in its own build.gradle,
// which we don't control/touch).
//
// This used to be split: only 'com.android.library' was declared here (apply false), while
// app_pojavlauncher separately pinned its own 'com.android.application' version directly.
// That got SimpleFPEWrapper's plugin resolving, but broke app_pojavlauncher's own with:
//   "Error resolving plugin [id: 'com.android.application', version: '8.11.1']
//    > ... already on the classpath with an unknown version, so compatibility cannot be
//    checked."
// Gradle can't reconcile one project pinning an explicit version for a plugin from the
// same underlying artifact (com.android.tools.build:gradle) that's already been resolved
// via a *different* project's "apply false" declaration - so there can only be one source
// of truth for the version. Keeping it here, with every module (including
// app_pojavlauncher) deferring to it unversioned, is the standard/documented pattern for
// mixing legacy apply-plugin modules into an otherwise plugins{}-DSL Android project.
plugins {
    id 'com.android.application' version '8.11.1' apply false
    id 'com.android.library' version '8.11.1' apply false
}
